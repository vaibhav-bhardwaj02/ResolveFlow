<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS Test</title>
</head>
<body>
    <h1>ResolveFlow CORS Test</h1>
    <button onclick="testConnection()">Test Backend Connection</button>
    <pre id="result"></pre>

    <script>
        async function testConnection() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';
            try {
                const response = await fetch('http://localhost:8080/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'corstest',
                        email: 'corstest@example.com',
                        password: 'test'
                    })
                });
                const text = await response.text();
                resultEl.textContent = 'Status: ' + response.status + '\n\nResponse body:\n' + text;
            } catch (err) {
                resultEl.textContent = 'Error: ' + err.message + '\n\nThis usually means CORS is blocking the request or the backend is not running.';
            }
        }
    </script>
</body>
</html>
